name: Metrics-Languages

on:
  schedule: # 03:30 CET == 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: thomas0903
          filename: metrics/languages.svg
          committer_branch: main
          committer_message: "Update languages card"
          config_timezone: Europe/Zurich
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_skipped: thomas0903/thomas0903
          commits_authoring: thomas0903, Thomas Molinari, 100191128+thomas0903@users.noreply.github.com
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming
          plugin_languages_ignored: d, makefile, dockerfile, batchfile, powershell, mako, perl, roff, cmake
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_other: no
          debug: yes
          debug: yes
