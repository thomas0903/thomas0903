name: Metrics-Languages

on:
  schedule: # 03:30 CET == 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/languages/package-lock.json

      - name: Install linguist-js
        working-directory: scripts/languages
        run: npm ci --no-audit --no-fund

      # Replaces lowlighter/metrics' indepth analysis, which re-ran linguist on
      # the whole repo for each commit and timed out on large histories.
      - name: Render languages card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          AUTHORS: thomas0903, Thomas Molinari, 100191128+thomas0903@users.noreply.github.com
          # Space-separated; repos that are mostly vendored third-party code
          SKIP: thomas0903/thomas0903 thomas0903/libpngfuzz thomas0903/cca26-project
          CATEGORIES: programming
          IGNORED: d, makefile, dockerfile, batchfile, powershell, mako, perl, roff, cmake
          ALIASES: tsx:TypeScript, jsx:JavaScript
          LIMIT: 8
          OUTPUT: metrics/languages.svg
          WORKDIR: ${{ runner.temp }}/repos
        run: python3 scripts/languages/card.py

      - name: Commit card
        run: |
          git add metrics/languages.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update languages card"
          git push
